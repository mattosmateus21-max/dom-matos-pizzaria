<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Pedido - Dom Matos Pizzaria</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="rastreio.css">
</head>
<body>

    <div class="container">
        <div class="tracker-card text-center">
            <h2 class="mb-3 text-danger">🍕 Dom Matos Pizzaria</h2>
            <h4>Acompanhamento do Pedido</h4>
            <h5 id="num-pedido" class="text-muted mb-4">Carregando ID do pedido...</h5>
            
            <div class="alert alert-secondary">
                Status Atual: <strong id="status-texto" class="text-dark">Aguardando conexão...</strong>
            </div>
            
            <!-- Barra de Progresso Visual / Timeline -->
            <div class="progress my-4" style="height: 30px;">
                <div id="barra-progresso" class="progress-bar progress-bar-striped progress-bar-animated bg-warning text-dark fw-bold" role="progressbar" style="width: 20%;" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">Recebido</div>
            </div>

            <hr class="my-4">

            <div class="text-start">
                <h6 class="fw-bold">Detalhes da Entrega:</h6>
                <p id="detalhes-pedido" class="text-muted">Buscando informações do pedido...</p>
            </div>

            <div class="mt-4">
                <a href="index.html" class="btn btn-outline-dark btn-sm">Voltar para o Início</a>
            </div>
        </div>
    </div>
    <script type="module" src="rastreio.js"></script>
</body>
</html>
