<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço e Formas de Pagamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="checkout-header">
        <h1>Finalizar Pedido</h1>
        <p class="checkout-subtitle">Confirme seus dados e envie o pedido pelo WhatsApp.</p>
    </header>

    <main class="checkout-main">
        <section id="checkoutSummaryCard" class="checkout-summary card hidden">
            <div class="summary-image">
                <img id="selectedProductImage" src="" alt="Produto selecionado">
            </div>
            <div class="summary-info">
                <h2 id="selectedProductName">Produto selecionado</h2>
                <p id="selectedProductDesc" class="summary-description"></p>
                <p class="price" id="selectedProductPrice"></p>
                <button id="removeProductButton" type="button" class="btn btn-outline-secondary hidden">Remover item</button>
            </div>
        </section>

        <section id="cartSection" class="checkout-summary card hidden">
            <div class="cart-header">
                <h2>Itens no Carrinho</h2>
                <button id="clearCartButton" type="button" class="btn btn-outline-secondary">Limpar carrinho</button>
            </div>
            <div class="cart-table-wrapper">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody"></tbody>
                </table>
            </div>
            <div class="cart-total">
                Total: <span id="cartTotal">R$ 0,00</span>
            </div>
        </section>

        <section id="noProductMessage" class="checkout-warning hidden">
            <p>Nenhum produto selecionado. <a href="index.html">Voltar ao cardápio</a></p>
        </section>

        <section class="checkout-form-card">
            <h2>Endereço</h2>
            <form id="checkoutForm" class="checkout-form">
                <div class="field-row">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome" required>
                </div>
                <div class="field-row">
                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome" placeholder="Sobrenome" required>
                </div>
                <div class="field-row">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="rua" placeholder="Rua" required>
                </div>
                <div class="field-row">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" placeholder="Número" required>
                </div>
                <div class="field-row">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Bairro" required>
                </div>

                <div class="payment-card">
                    <h2>Formas de Pagamento</h2>
                    <div class="payment-list">
                        <label class="payment-option">
                            <input type="radio" id="dinheiro" name="pagamentos" value="À vista" checked>
                            <span>À Vista</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" id="cartao" name="pagamentos" value="Cartão">
                            <span>Cartão</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" id="pix" name="pagamentos" value="Pix">
                            <span>Pix</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary checkout-submit">Enviar pedido para o WhatsApp</button>
            </form>
        </section>

        <section id="orderPreview" class="order-preview hidden">
            <h3>Resumo do Pedido</h3>
            <pre id="previewText" class="preview-text"></pre>
        </section>

        <p class="back-link"><a href="index.html">Voltar ao cardápio</a></p>
    </main>

    <script type="module"src="script.js" defer></script>
</body>
</html>
